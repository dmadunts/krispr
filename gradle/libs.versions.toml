[versions]
kotlin = "2.4.20"
junit = "6.1.3"
junit-platform-compat = "1.13.4"
# Compose runtime for the compiler tests; Kotlin and kctfork versions per compiler variant live in krispr-compiler/k*.
compose-runtime = "1.12.1"
agp = "9.4.1"
# Robolectric's plugin API, for the runtime's timing reporter; provided by the tests that use Robolectric.
robolectric = "4.16"
json-schema-validator = "1.5.9"
vanniktech-publish = "0.37.0"
gradle-plugin-publish = "2.2.1"

[libraries]
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-launcher-compat = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-compat" }
robolectric-pluginapi = { module = "org.robolectric:pluginapi", version.ref = "robolectric" }
agp-api = { module = "com.android.tools.build:gradle-api", version.ref = "agp" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
vanniktech-publish-plugin = { module = "com.vanniktech:gradle-maven-publish-plugin", version.ref = "vanniktech-publish" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
gradle-plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "gradle-plugin-publish" }
