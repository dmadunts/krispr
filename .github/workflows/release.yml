# Publishes a release when a v* tag is pushed: the runtime and compiler variants to Maven Central,
# and the Gradle plugin to Maven Central and the Gradle Plugin Portal.
#
# Needs these repository secrets:
#   MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD  (a Central Portal user token for the dev.krispr namespace)
#   SIGNING_KEY, SIGNING_KEY_PASSWORD               (an ASCII-armoured GPG private key and its passphrase)
#   GRADLE_PUBLISH_KEY, GRADLE_PUBLISH_SECRET       (Gradle Plugin Portal API key)
# and gradle.properties' version set to the tag's version (without the v) in the tagged commit.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        run: |
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - run: scripts/check-fast.sh
      - run: scripts/verify-published.sh
      - name: Publish
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishToMavenCentral :krispr-gradle:publishPlugins --no-configuration-cache
